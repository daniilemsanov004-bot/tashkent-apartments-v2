name: Scrape apartments

on:
  schedule:
    # GitHub не гарантирует ТОЧНО каждые 15 минут — в моменты высокой
    # нагрузки на GitHub Actions запуск может задержаться на несколько
    # минут. Для нашей задачи это не критично. Чаще, чем раз в 5 минут,
    # ставить не стоит — GitHub может начать пропускать слишком частые
    # расписания.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # позволяет запустить вручную кнопкой в GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка зависимостей
        run: npm install

      - name: Запуск проверки
        run: node src/run.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_AI_CLASSIFICATION: ${{ secrets.USE_AI_CLASSIFICATION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
