name: Scrape apartments

on:
  # Встроенное расписание GitHub убрано — оно сейчас сильно опаздывает
  # (иногда на часы вместо минут, это известная проблема GitHub Actions
  # в 2026 году, не наш баг). Вместо него запуск дёргает внешний
  # cron-сервис (cron-job.org) через API, см. README.
  workflow_dispatch: {} # позволяет запустить вручную кнопкой в GitHub, и именно этот же триггер дёргает внешний cron-сервис

# Инцидент 19.08.2026: один прогон завис на источнике, который начал
# блокировать буквально каждый запрос (см. circuit breaker в
# run.js), и т.к. concurrency-группы не было, cron-job.org каждые
# 15 минут запускал ЕЩЁ один прогон поверх зависшего — за пару часов
# накопилось 9 параллельных зависших прогонов одновременно, и ни один
# не успевал дойти до отправки объявлений.
#
# cancel-in-progress: false (а не true) — следующий триггер СТАВИТСЯ
# В ОЧЕРЕДЬ и ждёт, пока текущий прогон закончится, вместо того чтобы
# либо отменять его на середине (true — тогда прогон, который вот-вот
# дошёл бы до отправки, может обрываться раньше времени), либо
# запускаться параллельно без всякого ограничения (тогда два прогона
# одновременно видят одно и то же новое объявление, оба считают его
# новым через isKnown() и оба шлют уведомление в Telegram — дубли).
# Очередь защищает от обеих проблем разом: прогоны не теряются, не
# обрываются и не дублируют друг друга.
#
# Если прогоны регулярно не укладываются в 15 минут между триггерами
# cron-job.org — планово, не из-за зависания — то очередь начнёт
# копиться и уведомления будут запаздывать. В этом случае лечить нужно
# интервал на cron-job.org (увеличить) или причину медлительности
# (напр. частые фолбэки AI-цепочки при нестабильном Gemini), а не эту
# настройку.
concurrency:
  group: scrape-apartments
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Ограничение по времени вместе с cancel-in-progress: false (очередь
    # выше) — если прогон всё-таки зависнет (напр. источник снова начнёт
    # блокировать каждый запрос до срабатывания circuit breaker), он
    # сам оборвётся через 12 минут вместо того, чтобы висеть часами и
    # блокировать всю очередь следующих триггеров cron-job.org.
    timeout-minutes: 12
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установка зависимостей
        run: npm install

      - name: Запуск проверки
        run: node src/run.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_APARTMENT: ${{ secrets.TELEGRAM_GROUP_APARTMENT }}
          TELEGRAM_GROUP_APARTMENT_RENT: ${{ secrets.TELEGRAM_GROUP_APARTMENT_RENT }}
          TELEGRAM_GROUP_COMMERCIAL: ${{ secrets.TELEGRAM_GROUP_COMMERCIAL }}
          TELEGRAM_GROUP_COMMERCIAL_RENT: ${{ secrets.TELEGRAM_GROUP_COMMERCIAL_RENT }}
          TELEGRAM_GROUP_HOUSE: ${{ secrets.TELEGRAM_GROUP_HOUSE }}
          TELEGRAM_GROUP_DEALS: ${{ secrets.TELEGRAM_GROUP_DEALS }}
          USE_AI_CLASSIFICATION: ${{ secrets.USE_AI_CLASSIFICATION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Без этого флага providerPlan() в aiProviders.js добавляет в
          # цепочку ТОЛЬКО gemini — остальные ключи ниже (groq/openrouter/
          # mistral) просто игнорируются, даже если они заведены в
          # секретах. Именно поэтому таймаут gemini сразу давал
          # "chain exhausted" вместо отката на следующего провайдера.
          AI_FALLBACK_ENABLED: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 19.08.2026: Cerebras убран из цепочки целиком (не только из
          # кода, но и отсюда) — бесплатный тариф стал разовым
          # $5-кредитом, на аккаунте проекта исчерпан, стабильные 402.
          # Пятое звено вместо него — Mistral (см. ниже).
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # 19.08.2026: шестое и седьмое звено цепочки — SambaNova Cloud
          # и Cloudflare Workers AI, оба независимы от остальных
          # провайдеров по инфраструктуре (свои чипы / edge-сеть). Без
          # этих трёх секретов в репозитории (Settings → Secrets and
          # variables → Actions) они просто не попадут в цепочку — как
          # и раньше с MISTRAL_API_KEY, providerPlan() тихо их
          # пропустит, если переменная пустая.
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Опционально: http://user:pass@host:port резидентного/мобильного
          # прокси для запросов к OLX (см. src/http.js). Если секрет не
          # задан в репозитории — переменная просто пустая, и код работает
          # как раньше, напрямую с IP GitHub Actions runner'а.
          OLX_PROXY_URL: ${{ secrets.OLX_PROXY_URL }}
